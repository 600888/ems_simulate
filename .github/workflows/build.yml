name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python build dependencies
        run: uv sync --extra build

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Install MSIX packaging tool (winapp CLI)
        shell: pwsh
        run: |
          $w = Get-Command winapp -ErrorAction SilentlyContinue
          if (-not $w) {
            winget install Microsoft.WinAppCLI --accept-package-agreements --accept-source-agreements
          } else {
            Write-Host "winapp already installed: $($w.Source)"
          }

      - name: Build Windows application (Tauri + Sidecar) with MSIX
        shell: pwsh
        run: .\scripts\build_tauri_windows.ps1 -Msix

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ems-simulate-windows
          path: |
            src-tauri/target/release/ems-simulate.exe
            src-tauri/target/release/bundle/
            *.msix
          compression-level: 0
