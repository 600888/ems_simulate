name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python build dependencies
        run: uv sync --extra build

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build Windows application (Tauri + Sidecar)
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          .\scripts\build_tauri_windows.ps1

      - name: Upload build artifacts (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ems-simulate-windows
          path: |
            src-tauri/target/release/ems-simulate.exe
            src-tauri/target/release/bundle/
          compression-level: 0

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
